name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: messmind
          POSTGRES_PASSWORD: messmind
          POSTGRES_DB: messmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messmind -d messmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://messmind:messmind@localhost:5432/messmind_test
      # The ML service is NOT started in CI. Live ML contract tests stay skipped (ML_LIVE_TESTS unset).
      ML_API_URL: http://127.0.0.1:8001
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  ml-guard:
    name: ml/ and shared/ unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if ml/ or shared/ changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          # New branch (no "before" commit): compare against the default branch.
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "::warning::No base commit found; nothing to compare."
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD -- ml shared)"
          if [ -n "$changed" ]; then
            echo "::error::Changes under ml/ or shared/ are not allowed without explicit approval:"
            echo "$changed"
            exit 1
          fi
          echo "No changes under ml/ or shared/ (compared with $base)."
